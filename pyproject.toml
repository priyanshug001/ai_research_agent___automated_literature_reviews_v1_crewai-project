[project]
name = "ai_research_agent___automated_literature_reviews"
version = "0.1.0"
description = "ai_research_agent___automated_literature_reviews using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.27,<2.0.0",
    "exa-py",
    "pydantic",
]

[project.scripts]
ai_research_agent___automated_literature_reviews = "ai_research_agent___automated_literature_reviews.main:run"
run_crew = "ai_research_agent___automated_literature_reviews.main:run"
train = "ai_research_agent___automated_literature_reviews.main:train"
replay = "ai_research_agent___automated_literature_reviews.main:replay"
test = "ai_research_agent___automated_literature_reviews.main:test"
run_with_trigger = "ai_research_agent___automated_literature_reviews.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "d955cad3-16a2-4a27-8fb3-dbd5ae30d22d"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
